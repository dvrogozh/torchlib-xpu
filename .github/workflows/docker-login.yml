name: Docker Registry Login

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/docker-login.yml'
  workflow_dispatch:
    inputs:
      runners:
        description: 'Comma-separated runner labels (e.g., bmg, dg2)'
        required: true
        default: '["bmg","dg2"]'
        type: string

jobs:
  docker-login-pr:
    runs-on: "bmg"
    if: github.event_name == 'pull_request'
    steps:
      - name: Log in to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}

  docker-login:
    runs-on: ${{matrix.runner }}
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        runner: ${{ fromJson(github.event.inputs.runners) }}
    steps:
      - name: Log in to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}
          logout: false
